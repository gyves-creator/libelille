  # ── Actualité locale : les 8 plus grandes villes (regroupées sous l'onglet « Local ») ──
  - nom: Paris
    slug: paris
    groupe: local
    quota: 2
    declenchement: &declenchement_local
      debut: 8                 # rien avant 8h
      rattrapage: 16           # à partir de 16h, si rien n'a été publié : meilleur sujet du jour (en ligne pour le retour du travail)
      seuil_medias: 2          # « info importante » = reprise par au moins 2 médias…
      fraicheur_heures: 4      # … ou contenant un mot-clé important, et de moins de 4h
      max_par_passage: 4
    photo_defaut: "Paris ville rue"
    filtre: '\bparis\b|parisien|arrondissement|île-de-france|ile-de-france|seine-saint-denis|hauts-de-seine|val-de-marne|ratp|périphérique|saint-denis|boulogne-billancourt|montreuil'
    exclure: 'présidentielle|élysée|gouvernement|ministre|assemblée nationale|sénat|budget 2027|bourse|cac 40'
    consignes: &consignes_local |
      Cet article est une actualité locale. Règles impératives :
      - Commence par l'essentiel pour les habitants : quoi, où (quartier, rue, commune), quand, et ce que ça change pour eux
        (route coupée, transports perturbés, consignes des autorités).
      - Faits divers : ne donne jamais le nom d'une victime, d'un mineur ou d'un suspect non condamné.
        Respecte la présomption d'innocence (« un homme a été interpellé », « une enquête est ouverte »), jamais « le coupable ».
        Aucun détail macabre ou sensationnaliste.
      - Si une seule source rapporte l'information, reste prudent : utilise le conditionnel et n'ajoute rien qu'elle ne dit pas.
      - Termine si possible par une information pratique (numéro utile, site de la mairie ou de la préfecture, déviation).
    flux:
      - https://news.google.com/rss/search?q=Paris%20when%3A1d&hl=fr&gl=FR&ceid=FR:fr
