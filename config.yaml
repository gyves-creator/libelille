# ─────────────────────────────────────────────────────────────
#  libelille.fr — configuration (c'est le seul fichier à modifier)
# ─────────────────────────────────────────────────────────────

site:
  nom: "Libelille"
  slogan: "L'actualité, vite et clairement"
  domaine: "www.libelille.fr"
  langue: "fr"
  fuseau: "Europe/Paris"
  mention_ia: "Article rédigé avec l'aide d'une intelligence artificielle et publié sous la responsabilité de la rédaction."
  afficher_sources: false
  # Ton compte AdSense (repris de l'ancien site). Laisse vide pour ne pas afficher de publicité.
  adsense_client: "ca-pub-2944434087067586"
  # Google Analytics 4 (facultatif) : identifiant du type G-XXXXXXX
  ga4: ""

publication:
  articles_par_jour: 10        # national + présidentielle (les villes ont leur propre règle, 1 par ville et par jour)
  max_par_passage: 3
  heure_debut: 6
  heure_fin: 23
  # Créneaux de publication (heure de Paris → nombre d'articles nationaux), calés juste AVANT les pics de lecture :
  # trajets du matin (7h-9h), pause déjeuner (12h-14h), retour du travail (17h-19h), soirée (21h-22h).
  # Si un créneau n'a pas pu être rempli (pas de sujet), le retard est rattrapé au passage suivant.
  creneaux:
    6: 2      # en ligne pour les trajets du matin
    7: 1
    11: 2     # pour la pause déjeuner
    12: 1
    16: 2     # pour le retour du travail
    17: 1
    20: 1     # pour la soirée
  fenetre_heures: 8
  mots_min: 250

ia:
  fournisseurs:
    - nom: gemini
      url: "https://generativelanguage.googleapis.com/v1beta/openai/chat/completions"
      cle_env: GEMINI_API_KEY
      modele: "gemini-2.5-flash"
    - nom: groq
      url: "https://api.groq.com/openai/v1/chat/completions"
      cle_env: GROQ_API_KEY
      modele: "openai/gpt-oss-120b"

# Rubriques d'actualité alimentées chaque jour par le robot.
# « filtre » : ne garder que les dépêches dont le titre ou le résumé correspond (expression régulière).
# « priorite » : bonus pour que la rubrique passe avant les autres (au moins 1 article par jour garanti).
# « consignes » : règles de rédaction supplémentaires pour cette rubrique.
rubriques:
  - nom: Présidentielle 2027
    slug: presidentielle
    quota: 2
    priorite: 50
    photo_defaut: "urne électorale bureau de vote"
    filtre: 'présidentielle|presidentielle|élysée|candidat|parrainage|sondage|primaire'
    blackout_scrutins: ["2027-04-18", "2027-05-02"]
    consignes: |
      Cet article porte sur l'élection présidentielle. Règles impératives :
      - Neutralité totale : même ton, même rigueur et même vocabulaire pour tous les candidats et tous les partis.
        Aucun adjectif valorisant ou dévalorisant, aucune opinion, aucun pronostic de ta part.
      - Présente les faits et les positions tels que rapportés, en les attribuant clairement (« selon… », « a déclaré… »).
        Si un candidat est critiqué ou contesté dans les dépêches, mentionne aussi sa réponse si elle y figure.
      - Sondages : cite l'institut, la date, la taille de l'échantillon et rappelle qu'un sondage est une photographie
        de l'opinion à un instant donné, pas une prédiction. Ne cite jamais un sondage sans ces éléments.
      - Ne donne jamais de conseil de vote et n'appelle pas à voter pour ou contre qui que ce soit.
      - Pour les dates, l'inscription sur les listes et les modalités de vote, renvoie vers service-public.gouv.fr.
    flux:
      - https://www.lemonde.fr/politique/rss_full.xml
      - https://www.francetvinfo.fr/politique.rss
      - https://www.lefigaro.fr/rss/figaro_politique.xml
      - https://www.france24.com/fr/france/rss
  - nom: Politique
    slug: politique
    quota: 2
    photo_defaut: "Assemblée nationale hémicycle"
    flux:
      - https://www.lemonde.fr/politique/rss_full.xml
      - https://www.francetvinfo.fr/politique.rss
      - https://www.lefigaro.fr/rss/figaro_politique.xml
      - https://www.france24.com/fr/france/rss
  - nom: International
    slug: international
    quota: 2
    photo_defaut: "Globe terrestre"
    flux:
      - https://www.lemonde.fr/international/rss_full.xml
      - https://www.francetvinfo.fr/monde.rss
      - https://www.lefigaro.fr/rss/figaro_international.xml
      - https://www.france24.com/fr/europe/rss
  - nom: Économie
    slug: economie
    quota: 2
    photo_defaut: "Palais Brongniart Bourse de Paris"
    flux:
      - https://www.lemonde.fr/economie/rss_full.xml
      - https://www.francetvinfo.fr/economie.rss
      - https://www.lefigaro.fr/rss/figaro_economie.xml
  - nom: Société
