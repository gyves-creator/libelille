name: Publication automatique

on:
  schedule:
    - cron: "17 4-21 * * *"     # toutes les heures : articles + brèves (5h-22h heure de Paris en hiver ; 6h-23h en été)
    - cron: "47 5-20 * * *"     # à la demi-heure : brèves du fil seulement (passage court)
  workflow_dispatch:
    inputs:
      nombre:
        description: "Publier N articles maintenant (vide = comportement normal, 0 = juste mettre le site à jour)"
        required: false
        default: ""
  push:
    branches: [main]
    paths: ["config.yaml", "build.py", "static/**", "content/guides/**", "content/pages/**", "content/mentions-legales.html", "legacy/**"]

permissions:
  contents: write

concurrency:
  group: publication
  cancel-in-progress: false

jobs:
  publier:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main   # toujours la dernière version (un passage en file d'attente ne repart pas d'une version périmée)

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - run: pip install -r requirements.txt

      - name: Photos des guides (Pixabay)
        if: github.event.schedule != '47 5-20 * * *'
        env:
          PIXABAY_API_KEY: ${{ secrets.PIXABAY_API_KEY }}
          PEXELS_API_KEY: ${{ secrets.PEXELS_API_KEY }}
        run: python -m pipeline.photos_guides

      - name: Veille et rédaction
        if: github.event_name != 'push'
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          PIXABAY_API_KEY: ${{ secrets.PIXABAY_API_KEY }}
          PEXELS_API_KEY: ${{ secrets.PEXELS_API_KEY }}
          LEFIL_QUOTA: ${{ github.event.inputs.nombre }}
          LEFIL_MODE: ${{ github.event.schedule == '47 5-20 * * *' && 'breves' || '' }}
        run: python -m pipeline.run

      - name: Enregistrer les nouveaux articles et photos
        run: |
          git config user.name "libelille-robot"
          git config user.email "libelille-robot@users.noreply.github.com"
          git add content state legacy
          git diff --cached --quiet || git commit -m "Nouveaux articles $(date -u +'%Y-%m-%d %H:%M')"
          git pull --rebase origin main
          git push

      - name: Générer le site
        run: python build.py

      - name: Envoyer sur l'hébergement OVH (FTP)
        uses: SamKirkland/FTP-Deploy-Action@v4.3.5
        with:
          server: ${{ secrets.FTP_SERVER }}
          username: ${{ secrets.FTP_USER }}
          password: ${{ secrets.FTP_PASSWORD }}
          protocol: ${{ secrets.FTP_PROTOCOLE || 'ftp' }}
          local-dir: ./public/
          server-dir: ${{ secrets.FTP_DOSSIER || 'libelille.fr/' }}
